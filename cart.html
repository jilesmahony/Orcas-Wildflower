<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Orcas Wildflower</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,400..600&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header" id="site-header"></header>

<main>
  <div class="page-hero">
    <div class="container">
      <div class="breadcrumb"><a href="index.html">Home</a> / Your Cart</div>
      <h1>Your Cart</h1>
    </div>
  </div>

  <section>
    <div class="container">

      <div id="cart-empty" class="empty-msg" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h2l1.4 10.2a2 2 0 0 0 2 1.8h7.6a2 2 0 0 0 2-1.6L21 9H7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p>Your cart is empty. <a href="index.html" class="btn-ghost">Keep browsing</a></p>
      </div>

      <div class="cart-layout" id="cart-layout">
        <div>
          <div id="cart-lines"></div>
        </div>
        <div>
          <div class="summary-card">
            <h3>Order Summary</h3>
            <div id="cart-summary-body"></div>
          </div>

          <div class="summary-card" style="margin-top:24px;" id="checkout-form-wrap">
            <h3>Shipping &amp; Checkout</h3>
            <form id="quote-form" style="margin-top:16px;">
              <div class="form-field">
                <label for="quote-zip">ZIP Code</label>
                <div style="display:flex;gap:10px;">
                  <input type="text" id="quote-zip" inputmode="numeric" placeholder="98245" required>
                  <button type="submit" class="btn btn-outline" id="quote-btn" style="white-space:nowrap;">Calculate Shipping &amp; Tax</button>
                </div>
                <p class="summary-note" id="quote-status" style="color:var(--poppy-dark);"></p>
              </div>
              <div id="quote-results"></div>
              <button type="button" class="btn btn-accent btn-block" id="checkout-submit-btn" style="margin-top:18px;" disabled>Checkout</button>
              <p class="summary-note" id="checkout-status" style="color:var(--poppy-dark);"></p>
            </form>
            <p class="summary-note">You'll enter your card and confirm your shipping address on Square's secure checkout page. All sales are final.</p>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="assets/js/nav.js"></script>
<script src="assets/js/cart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/checkout.js"></script>
<script>
  injectChrome("cart.html");
  initCartPage();
  if (!CHECKOUT_CONFIG.workerUrl) {
    document.getElementById("checkout-form-wrap").innerHTML =
      '<div class="admin-note">Checkout isn\'t configured yet — fill in <code>CHECKOUT_CONFIG.workerUrl</code> in <code>assets/js/config.js</code> once your Worker is deployed (see <code>worker/README.md</code>).</div>';
  } else {
    document.getElementById("quote-form").addEventListener("submit", handleGetQuote);
    document.getElementById("checkout-submit-btn").addEventListener("click", handleCheckout);
  }
</script>
</body>
</html>
