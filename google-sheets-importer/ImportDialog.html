<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; padding: 6px; color: #232E27; }
    p { line-height: 1.5; }
    input[type="file"] { margin: 14px 0; }
    button {
      background: #29402E; color: white; border: none; padding: 10px 18px;
      border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #status { margin-top: 14px; font-weight: bold; }
    .warn { color: #A24653; }
    .ok { color: #29402E; }
  </style>
</head>
<body>
  <p><strong>This will completely replace everything in this sheet</strong> with the contents of the CSV file you choose. Make sure it's the right file before importing.</p>
  <input type="file" id="file" accept=".csv">
  <br>
  <button id="importBtn" onclick="doImport()">Import &amp; Replace</button>
  <div id="status"></div>

  <script>
    function doImport() {
      const fileInput = document.getElementById("file");
      const status = document.getElementById("status");
      const btn = document.getElementById("importBtn");
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Choose a CSV file first.";
        status.className = "warn";
        return;
      }
      btn.disabled = true;
      status.textContent = "Importing…";
      status.className = "";

      const reader = new FileReader();
      reader.onload = function (e) {
        google.script.run
          .withSuccessHandler(function (count) {
            status.textContent = "Imported " + count + " products! Closing…";
            status.className = "ok";
            setTimeout(function () { google.script.host.close(); }, 1200);
          })
          .withFailureHandler(function (err) {
            status.textContent = "Error: " + err.message;
            status.className = "warn";
            btn.disabled = false;
          })
          .importCsvData(e.target.result);
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
